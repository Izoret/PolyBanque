services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: bankiz

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bankiz
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - db
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://root:root@db:5432/bankiz
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?We need a Master key!}
    stdin_open: true
    tty: true

volumes:
  postgres_data:
